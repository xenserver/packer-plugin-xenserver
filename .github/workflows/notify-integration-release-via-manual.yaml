# Notifies the HashiCorp integration registry of a new plugin version. Dispatch it
# by hand, last, once the GitHub Release for that version is published here. It
# only works from this repository, the one registered for the integration. The
# registry cannot retract a version, so check the version number first.
name: Notify Integration Release (Manual)
on:
  workflow_dispatch:
    inputs:
      # Everything else is derived from this one input.
      version:
        description: "Release version, with or without a leading v, e.g. v1.0.0. The matching tag must already exist here."
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  notify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release version and tag
        id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          value="${RAW_VERSION#v}"
          # Plain X.Y.Z only; this also rules out the -dev and -test prereleases
          # used for snapshot builds.
          if [[ ! "${value}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release version like v1.0.0, got '${RAW_VERSION}'." >&2
            exit 1
          fi
          echo "value=${value}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${value}" >> "${GITHUB_OUTPUT}"
      - name: Checkout the release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Fails if the tag does not exist: publish the release first.
          ref: ${{ steps.version.outputs.tag }}
      - name: Resolve the release commit
        id: commit
        # The action sends release_sha to the registry unresolved, so pass a commit SHA.
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      # The committed docs must match what `make generate` produces.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Set up XenServer Go SDK
        uses: ./.github/actions/setup-xenserver-sdk
        with:
          sdk-url: ${{ vars.XENSERVER_SDK_URL }}
      - name: Put the Go tool bin directory on PATH
        run: |
          # `make generate` installs packer-sdc with `go install` and then runs it
          # from PATH.
          mkdir -p "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Generate docs
        run: make generate
      - name: Check that generated docs are committed
        run: |
          if [[ -z "$(git status -s)" ]]; then
            echo "OK"
          else
            echo "Docs have been updated, but the compiled docs have not been committed."
            echo "Run 'make generate', and commit the result to resolve this error."
            git status -s
            exit 1
          fi
      - name: Notify Release
        # Pinned to a commit: the action publishes no release tags.
        uses: hashicorp/integration-release-action@5c982331bf102b6d9ffae6f820eb9ffda93cd7ea
        with:
          integration_identifier: "packer/xenserver/xenserver"
          release_version: ${{ steps.version.outputs.value }}
          release_sha: ${{ steps.commit.outputs.sha }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
